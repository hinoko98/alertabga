# Puerto 27018 para no chocar con un MongoDB local instalado en 27017.
# Servicios locales complementarios. Supabase se levanta aparte con `npx supabase start`.
services:
  mongo:
    image: mongo:7
    container_name: alertabga_mongo
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
